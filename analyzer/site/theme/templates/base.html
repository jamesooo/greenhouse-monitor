<!doctype html>
<html lang="{{ DEFAULT_LANG }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}{{ SITENAME }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ SITEURL }}/theme/css/site.css">
</head>
<body>
  <header class="masthead">
    <a class="brand" href="{{ SITEURL }}/">{{ SITENAME }}</a>
    <nav aria-label="Primary navigation">
      <a href="{{ SITEURL }}/">Latest</a>
      <a href="{{ SITEURL }}/archive.html">Archive</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Generated from the greenhouse monitoring dashboard.</footer>
</body>
</html>
